<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — Ichiban Dental</title>
    <link rel="stylesheet" href="adminLogin.css" />
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
</head>
<body>

<div class="login-wrapper">

    <div class="login-brand">
        <div class="brand-logo">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="20" cy="20" r="20" fill="#008CB6"/>
                <path d="M13 12C13 10.3 14.3 9 16 9C17.7 9 19 10.3 19 12V22C19 23.7 17.7 25 16 25C14.3 25 13 23.7 13 22V12Z" fill="white"/>
                <path d="M21 12C21 10.3 22.3 9 24 9C25.7 9 27 10.3 27 12V22C27 23.7 25.7 25 24 25C22.3 25 21 23.7 21 22V12Z" fill="white" opacity="0.7"/>
                <path d="M15 25C15 25 16 31 20 31C24 31 25 25 25 25" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>
        <div class="brand-text">
            <span class="brand-name">Ichiban Dental</span>
            <span class="brand-sub">Admin Portal</span>
        </div>
    </div>

    <div class="login-card">
        <div class="login-card-header">
            <h1>Welcome back</h1>
            <p>Sign in to manage your clinic</p>
        </div>

        <div id="errorMsg" class="error-banner" style="display:none;"></div>

        <div class="login-form">
            <div class="field-group">
                <label for="emailInput">Username / Email</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="emailInput" class="field-input" placeholder="admin" autocomplete="username" />
                </div>
            </div>

            <div class="field-group">
                <label for="passwordInput">Password</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="passwordInput" class="field-input" placeholder="••••••••" autocomplete="current-password" />
                    <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
                        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button class="login-btn" id="loginBtn">
                <span class="btn-text">Sign In</span>
                <span class="btn-loader" style="display:none;">
                    <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                    </svg>
                    Signing in...
                </span>
            </button>
        </div>

        <p class="back-link"><a href="../contact.html">← Back to main site</a></p>
    </div>

    <div class="login-decoration">
        <div class="deco-circle deco-1"></div>
        <div class="deco-circle deco-2"></div>
        <div class="deco-circle deco-3"></div>
    </div>

</div>

<script src="adminLogin.js"></script>
</body>
</html>
